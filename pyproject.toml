[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-intel"
version = "2.0.0"
description = "Aspect-level sentiment for car reviews: a small encoder distilled from a local LLM teacher, with evidence and entities"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmed Khaled Ali", email = "phoniex199940@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
entities = ["gliner>=0.2.16"]
data = ["httpx>=0.27"]
demo = ["gradio>=5.9", "pandas>=2.2", "plotly>=5.24", "gliner>=0.2.16"]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"space/app.py" = ["E501"]
"src/review_intel/data/synth.py" = ["E501"]
"src/review_intel/evaluate.py" = ["E501"]  # markdown table rows
